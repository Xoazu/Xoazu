name: Generate contribution space shooter

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Runs the gh-space-shooter CLI directly (the action would commit to main);
      # the GIF goes only to the output branch, so main keeps a single commit.
      - name: Generate space shooter GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          pip install gh-space-shooter==2.0.5
          gh-space-shooter ${{ github.repository_owner }} --output dist/gh-space-shooter.gif --strategy random --fps 40

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
